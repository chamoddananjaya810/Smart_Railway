<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Train Stations Table</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
        <style>
            .form-row {
                display: flex;
                flex-wrap: wrap;
                margin-right: -5px;
                margin-left: -5px;
            }
            .form-row > .col,
            .form-row > [class*="col-"] {
                padding-right: 5px;
                padding-left: 5px;
            }
            .form-group {
                margin-bottom: 1rem;
            }
        </style>

    </head>
    <body class="bg-light" onload="loadSimpleBooking();">
        <div id="navbar" ></div>
        <div class="container mt-5 py-5">
            <div class="card shadow">
                <!-- Header -->
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0 text-center">🚂 Train Stations Management</h3>
                </div>

                <!-- Add New Station Form Table -->
                <div class="card-body p-3 bg-light">
                    <div class="row g-2 align-items-end">
                        <!-- Station ID input -->
                        <div class="col-md-4">
                            <label for="stationId" class="form-label">Station ID</label>
                            <input type="text" class="form-control" id="stationId" placeholder="ST007">
                        </div>

                        <!-- Platform select -->
                        <div class="col-md-4">
                            <label for="platformSelect" class="form-label">Platform</label>
                            <select id="platformSelect" class="form-select form-select-sm">
                                <option value="">Select Platform</option>
                                <option value="Platform A">Platform A</option>
                                <option value="Platform B">Platform B</option>
                                <option value="Platform C">Platform C</option>
                                <option value="Platform D">Platform D</option>
                            </select>
                        </div>

                        <!-- Add button -->
                        <div class="col-md-2">
                            <button class="btn btn-success btn-sm w-100" onclick="addNewRow(this)">➕ Add</button>
                        </div>
                    </div>
                </div>




            </div>




            <!-- Table -->
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" id="stationTable">
                        <thead class="table-danger">
                            <tr>
                                <th scope="col" class="text-nowrap">Station ID</th>
                                <th scope="col" class="text-nowrap">Station</th>
                                <th scope="col" class="text-nowrap">Stop Platform</th>
                                <th scope="col" class="text-nowrap">Arrival Time</th>
                                <th scope="col" class="text-nowrap">Departure Time</th>
                                <th scope="col" class="text-nowrap">Train Route ID</th>
                                <th scope="col" class="text-nowrap">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Sample rows will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>


        </div>

        <!-- Statistics Cards -->
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-danger">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Stations</h5>
                        <h2 class="mb-0">6</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-danger">
                    <div class="card-body text-center">
                        <h5 class="card-title text-danger">Active Platforms</h5>
                        <h2 class="mb-0 text-danger">4</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-danger">
                    <div class="card-body text-center">
                        <h5 class="card-title text-danger">Routes</h5>
                        <h2 class="mb-0 text-danger">6</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-danger">
                    <div class="card-body text-center">
                        <h5 class="card-title text-danger">On Time</h5>
                        <h2 class="mb-0 text-success">98%</h2>
                    </div>
                </div>
            </div>
        </div>

        <script src="assets/js/simple-booking.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
        <div id="navbar"></div> <script>
                                fetch('nav-bar.html')
                                        .then(response => response.text())
                                        .then(html => {
                                            document.getElementById('navbar').innerHTML = html;
                                        });
        </script>
        <script>
            // Add click event listeners to action buttons
            document.querySelectorAll('.btn-outline-primary').forEach(button => {
                button.addEventListener('click', function () {
                    const row = this.closest('tr');
                    const stationId = row.cells[0].textContent;
                    alert(`Viewing details for ${stationId}`);
                });
            });

            document.querySelectorAll('.btn-outline-warning').forEach(button => {
                button.addEventListener('click', function () {
                    const row = this.closest('tr');
                    const stationId = row.cells[0].textContent;
                    alert(`Editing ${stationId}`);
                });
            });

            document.querySelectorAll('.btn-outline-danger').forEach(button => {
                button.addEventListener('click', function () {
                    const row = this.closest('tr');
                    const stationId = row.cells[0].textContent;
                    if (confirm(`Are you sure you want to delete ${stationId}?`)) {
                        row.remove();
                    }
                });
            });
        </script>
    </body>
</html>
